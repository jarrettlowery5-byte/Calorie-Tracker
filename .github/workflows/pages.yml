name: Publish The Weekly to GitHub Pages

# GitHub Pages for this repo serves the docs/ folder of the calorie tracker's
# branch. Rather than switching Pages to a different mode (which would take
# that app down), this workflow builds The Weekly and commits the output to
# docs/weekly/ on that same branch, so both apps stay live:
#   https://<user>.github.io/Calorie-Tracker/         -> calorie tracker
#   https://<user>.github.io/Calorie-Tracker/weekly/  -> The Weekly

on:
  push:
    branches:
      - claude/the-weekly-app-b8gkf5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-weekly
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          # Local mode: data lives in the phone's browser storage; the
          # Suggest button uses an API key the user pastes into Settings.
          VITE_DATA_MODE: local
          GHPAGES_BASE: /Calorie-Tracker/weekly/
      - uses: actions/checkout@v4
        with:
          ref: claude/calorie-macro-tracker-jvqdkk
          path: pages-branch
      - name: Copy build into docs/weekly and push
        run: |
          rm -rf pages-branch/docs/weekly
          mkdir -p pages-branch/docs
          cp -r client/dist pages-branch/docs/weekly
          cd pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/weekly
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish The Weekly to docs/weekly (from ${GITHUB_SHA::7})"
            git push origin claude/calorie-macro-tracker-jvqdkk
          fi
