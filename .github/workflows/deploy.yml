# Build the app and publish it to GitHub Pages, where it can be installed to a
# phone home screen as a standalone PWA.
#
# One-time setup: repository Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". Without that, this workflow's deploy step fails.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/catan-board-game-app-7x8x5e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        # A project site is served from /<repo>/, so the bundle needs that base.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
